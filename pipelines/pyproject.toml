[project]
name = "pipelines"
version = "0.1.0"
description = "Mapterhorn terrain + bathymetry pipelines"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "imagecodecs>=2023.3.16",
    "mercantile>=1.2.1",
    "numpy>=1.24.4",
    "pillow>=10.4.0",
    "pmtiles>=3.4.1",
    "pyproj>=3.5.0",
    "python-ulid>=1.1.0",
    "rasterio>=1.3.11",
    "requests>=2.32.4",
    "scipy>=1.10.1",
    "supermercado>=0.2.0",
]

[project.scripts]
mapterhorn = "mapterhorn:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobs"]
include = ["mapterhorn.py"]

[tool.uv]
package = true
